[package]
name = "myserver-load-test"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "loadtest_core"
path = "src/lib.rs"

[[bin]]
name = "loadtest"
path = "src/bin/loadtest.rs"

[[bin]]
name = "account-prepare"
path = "src/bin/account_prepare.rs"

[build-dependencies]
prost-build = "=0.13.5"
protoc-bin-vendored = "=3.2.0"
tonic-build = "=0.12.3"

[dependencies]
base64 = "0.22"
ctrlc = "3.4"
futures-util = "0.3"
tonic = { version = "0.12", features = ["tls"] }
game-protocol = { path = "../../packages/game-protocol" }
hdrhistogram = { version = "7.5.4", features = ["serialization"] }
lockstep-client = { path = "../lockstep-client" }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sim-core = { path = "../../packages/sim-core" }
thiserror = "=2.0.11"
tokio = { version = "=1.50.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio_kcp = "=0.9.8"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
rcgen = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
