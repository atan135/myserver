[package]
name = "myserver-load-test"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "loadtest_core"
path = "src/lib.rs"

[[bin]]
name = "loadtest"
path = "src/bin/loadtest.rs"

[[bin]]
name = "account-prepare"
path = "src/bin/account_prepare.rs"

[build-dependencies]
prost-build = "=0.13.5"
protoc-bin-vendored = "=3.2.0"

[dependencies]
base64 = "0.22"
ctrlc = "3.4"
game-protocol = { path = "../../packages/game-protocol" }
hdrhistogram = { version = "7.5.4", features = ["serialization"] }
prost = "0.13"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sim-core = { path = "../../packages/sim-core" }
thiserror = "=2.0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
